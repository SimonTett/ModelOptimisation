[template variables=HOST_EX]
compulsory=true
description=Select which EX host to submit to:
           ='exab' = EXA/B
           ='excd' = EXC/D
           ='exz' = EXZ
help=Select the login node to be used when running the model on the MetO EX Cray.
    =Use 'exab', 'excd' or 'exz' for the new MetO Cray HPC.
    =Note that using 'exab' or 'excd' should result in the scheduler picking
    =which ever of the two quads is least loaded. 
ns=host
sort-key=1a
values='exab', 'excd', 'exz'

[template variables=HOST_XC40]
compulsory=true
description=Select which XC40 host to submit to:
           ='xc' = XCE/XCF
           ='xcs' = XCS
           ='xcs-c' = MONSooN
help=Select the login node used for the suite when run on the XC40.
    =Use 'xc' to allow rose host-select to choose the node (between XCE
    =and XCF). Use 'xcs' to choose one of the two research login nodes
    =on XCS. Use 'xcs-c' to submit to MONSooN.
    =
    =Note that when submitting to MONSooN you should also change
    =mooproject and ACCOUNT_USR to correspond to your MONSooN account.
ns=host
sort-key=1a
values='xc', 'xcel00', 'xcel01', 'xcfl00', 'xcfl01', 'xcs', 'xcslr0', 'xcslr1'

