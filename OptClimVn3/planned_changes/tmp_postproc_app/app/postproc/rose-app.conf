# ==============================================================================
# Custom Aggregation - MERGE INTO YOUR EXISTING postproc/rose-app.conf
# ==============================================================================
#
# Integration steps:
# 1. Merge the [env] section below into your existing rose-app.conf
# 2. Add the [command] aggregate line
# 3. Add the [file:postproc/aggregate_config.json] section
# 4. Modify your existing [namelist:pptransfer] to use ${TRANSFER_DIR}
#
# Edit TRANSFER_DIR in Rose Config Editor for your workflow
# ==============================================================================

[env]
TRANSFER_DIR=/gws/nopw/j04/terrafirma/tetts/um_archive
MODEL_NAME=${CYLC_WORKFLOW_NAME}
AGGREGATE_OUTPUT_FILENAME=aggregated.nc
OUTPUT_FILE=${TRANSFER_DIR}/${MODEL_NAME}/${AGGREGATE_OUTPUT_FILENAME}
AGGREGATE_CONFIG=$ROSE_DATA/postproc/aggregate_config.json

[command]
aggregate=bin/aggregate.sh

[file:postproc/aggregate_config.json]
source=file:postproc/aggregate_config.json

# ==============================================================================
# MODIFY YOUR EXISTING [namelist:pptransfer]:
# Change: transfer_dir=/your/old/path
# To:     transfer_dir=${TRANSFER_DIR}
# ==============================================================================
